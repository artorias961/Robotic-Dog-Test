# Test-001 Teensy2 - Ethernet UDP test (Teensy 4.1, Zephyr v4.4)
# Same as Teensy1/prj.conf except for the IP address.

# ---- C++20 --------------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
# Full C++ standard library: std::optional, std::span, ...
CONFIG_REQUIRES_FULL_LIBCPP=y

# ---- Console over the Teensy's USB cable (shows up as a COM port) --------------
# Log output goes here. app.overlay points the console at this USB serial port.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
# This USB port carries the log, so its own driver can't log (it would loop).
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# ---- LED on pin 13: toggles on every ping answered -----------------------------
CONFIG_GPIO=y

# ---- Networking: static IPv4, no DHCP ------------------------------------------
# Ethernet itself needs nothing here: Zephyr's teensy41 board turns on the
# i.MX RT1062 Ethernet controller and the DP83825 chip on its own.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
# Must match kTeensy2Ip in ../common/comms.hpp (the build fails otherwise).
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.102"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_DHCPV4=n
# Don't hold up boot waiting for the cable; main.cpp logs when the link is up.
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# ---- Logging and stacks ---------------------------------------------------------
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
